<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;min-height:100%}
body{
  min-height:100vh;min-height:100svh;
  color:#f0e6d2;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 24px;
  gap:clamp(40px,6vw,64px);
  background:radial-gradient(ellipse at 50% 45%,#1a1a1a 0%,#0a0a0a 55%,#000 100%);
  overflow-x:hidden;
}

/* ===================================================================
   POKER TABLE
=================================================================== */
.table-wrap{
  position:relative;
  width:min(780px,100%);
  aspect-ratio:3/2;
  filter:drop-shadow(0 50px 70px rgba(0,0,0,.75));
}

/* Wooden rail */
.rail{
  position:absolute;inset:0;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 30%,#5a3a1f 0%,#3d2614 55%,#1f1308 100%);
  box-shadow:
    inset 0 25px 50px rgba(0,0,0,.6),
    inset 0 -20px 40px rgba(0,0,0,.5);
}
.rail::before{
  /* Wood grain texture */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:
    repeating-linear-gradient(90deg,
      transparent 0 3px,
      rgba(255,220,180,.025) 3px 5px,
      transparent 5px 12px),
    repeating-linear-gradient(90deg,
      transparent 0 8px,
      rgba(0,0,0,.06) 8px 10px,
      transparent 10px 20px);
  mask-image:radial-gradient(ellipse,#000 50%,transparent 85%);
}

/* Gold ring (outer) */
.rail::after{
  content:"";position:absolute;inset:6%;
  border-radius:50%;
  border:1.5px solid #c9a35a;
  box-shadow:
    0 0 0 1px rgba(201,163,90,.25),
    inset 0 0 25px rgba(201,163,90,.08);
}

/* Felt */
.felt{
  position:absolute;inset:8%;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 38%,#2d7a4a 0%,#1e5a36 45%,#113d23 85%,#0a2816 100%);
  box-shadow:
    inset 0 18px 45px rgba(0,0,0,.5),
    inset 0 -12px 35px rgba(0,0,0,.45);
  overflow:hidden;
}
/* Faint betting lines on felt */
.felt::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 50%,transparent 24%,rgba(255,255,255,.04) 24.3%,transparent 25%),
    radial-gradient(circle at 50% 50%,transparent 32%,rgba(255,255,255,.03) 32.3%,transparent 33%),
    radial-gradient(circle at 50% 50%,transparent 40%,rgba(255,255,255,.025) 40.3%,transparent 41%);
}
/* Top highlight */
.felt::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 12%,rgba(255,255,255,.08),transparent 45%);
}

/* ===================================================================
   CARDS (face-up fan: A♠ K♥ Q♦)
=================================================================== */
.cards{
  position:absolute;
  top:40%;left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:clamp(4px,1vw,8px);
  z-index:3;
}
.card{
  position:relative;
  width:clamp(72px,11vw,110px);
  aspect-ratio:5/7;
  background:linear-gradient(145deg,#fdfaf0,#e8e1cd);
  border-radius:8px;
  box-shadow:
    0 15px 25px rgba(0,0,0,.55),
    0 2px 0 rgba(0,0,0,.4),
    inset 0 0 0 1px rgba(0,0,0,.08);
  font-family:Georgia,"Times New Roman",serif;
  color:#1a1a1a;
  overflow:hidden;
}
.card.red{color:#b02030}
.card .corner{
  position:absolute;
  font-weight:700;
  font-size:clamp(14px,2vw,22px);
  line-height:.85;
  text-align:center;
}
.card .corner.tl{top:8%;left:10%}
.card .corner.br{bottom:8%;right:10%;transform:rotate(180deg)}
.card .corner small{
  display:block;font-size:.8em;margin-top:2px;line-height:1;
}
.card .big{
  position:absolute;inset:0;
  display:grid;place-items:center;
  font-size:clamp(42px,6.5vw,72px);
  line-height:1;
}
.card.c1{transform:rotate(-8deg) translateY(4%)}
.card.c2{transform:translateY(-3%);z-index:1}
.card.c3{transform:rotate(8deg) translateY(4%)}

/* ===================================================================
   CHIP STACK
=================================================================== */
.chips{
  position:absolute;
  right:16%;bottom:22%;
  width:clamp(52px,7.5vw,78px);
  aspect-ratio:1;
  z-index:2;
}
.chip-disk{
  position:absolute;left:0;right:0;
  height:17%;
  border-radius:50%/100%;
  background:linear-gradient(180deg,#2a0c14 0%,#120408 100%);
  box-shadow:
    inset 0 2px 0 rgba(201,163,90,.35),
    inset 0 -2px 0 rgba(0,0,0,.6);
}
.chip-disk::before{
  /* Gold edge notches */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(90deg,
    transparent 0 5px,
    rgba(201,163,90,.95) 5px 7px,
    transparent 7px 12px);
  mask-image:linear-gradient(180deg,transparent 30%,#000 30%,#000 70%,transparent 70%);
  opacity:.85;
}
.chip-disk.top{
  background:radial-gradient(ellipse at 50% 40%,#3a1018 0%,#1a0508 85%);
  border:1px solid rgba(201,163,90,.45);
}
.chip-disk.top::after{
  content:"♠";
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:#c9a35a;
  font-family:Georgia,serif;
  font-size:48%;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.d1{bottom:0}.d2{bottom:13%}.d3{bottom:26%}.d4{bottom:39%}.d5{bottom:52%}.d6{bottom:65%}

/* Single chip */
.chip-single{
  position:absolute;
  left:22%;bottom:24%;
  width:clamp(42px,6vw,66px);
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8a1a30,#3d0812 70%,#1a0408);
  box-shadow:
    0 14px 24px rgba(0,0,0,.6),
    inset 0 2px 4px rgba(255,255,255,.18),
    inset 0 -4px 8px rgba(0,0,0,.4);
  z-index:2;
  transform:rotate(-12deg);
}
.chip-single::before{
  content:"";position:absolute;inset:16%;
  border-radius:50%;
  border:1.5px dashed rgba(201,163,90,.7);
}
.chip-single::after{
  content:"";position:absolute;inset:34%;
  border-radius:50%;
  background:radial-gradient(circle,#c9a35a 0%,#8a6a28 70%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.25);
}

/* ===================================================================
   HEADLINE + CTA
=================================================================== */
.copy{
  text-align:center;
  max-width:640px;
  width:100%;
  position:relative;
  z-index:5;
}
h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,5.5vw,56px);
  font-weight:600;
  line-height:1.05;
  letter-spacing:-.02em;
  color:#f8f2e2;
  margin-bottom:20px;
  text-wrap:balance;
}
h1 em{font-style:italic;color:#e4b074;font-weight:500}

.sub{
  color:#a69f8e;
  font-size:clamp(14px,1.3vw,17px);
  line-height:1.55;
  max-width:460px;
  margin:0 auto 36px;
}

.cta{
  display:inline-flex;align-items:center;justify-content:center;
  gap:16px;
  width:min(440px,100%);
  min-height:66px;
  padding:0 32px;
  background:linear-gradient(180deg,#eacb8a 0%,#c9a35a 55%,#a1792c 100%);
  color:#1a0f08;
  font-size:14px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  border-radius:4px;
  border:1px solid rgba(255,230,180,.45);
  text-decoration:none;
  box-shadow:
    0 18px 40px rgba(201,163,90,.25),
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -1px 0 rgba(0,0,0,.3);
  transition:transform .25s ease,filter .25s ease,box-shadow .25s ease;
}
.cta:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
  box-shadow:
    0 24px 48px rgba(201,163,90,.35),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.3);
}
.cta svg{width:20px;height:20px;flex:none}
.cta .arrow{font-size:22px;font-weight:400;transition:transform .25s ease}
.cta:hover .arrow{transform:translateX(5px)}

.note{
  margin-top:20px;
  color:#8a8273;
  font-size:12px;
  letter-spacing:.08em;
}

/* ===================================================================
   MOBILE
=================================================================== */
@media(max-width:640px){
  body{padding:28px 16px;gap:32px}
  .table-wrap{aspect-ratio:3/2.1}
  .card{width:clamp(60px,15vw,82px)}
  .chips{right:14%;bottom:20%;width:min(13vw,62px)}
  .chip-single{left:20%;bottom:22%;width:min(10vw,48px)}
  h1{font-size:clamp(30px,8vw,42px)}
  .sub{font-size:14px;margin-bottom:28px}
  .cta{
    width:100%;
    min-height:62px;
    font-size:12px;
    letter-spacing:.12em;
    padding:0 22px;
  }
}
@media(max-width:380px){
  .table-wrap{aspect-ratio:3/2.25}
  .card{width:min(17vw,70px)}
  .cards{gap:3px}
  h1{font-size:28px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
